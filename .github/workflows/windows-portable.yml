name: Windows portable

on:
  pull_request:
    paths:
      - 'app/**'
      - 'data/**'
      - 'packaging/windows/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/windows-portable.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/**'
      - 'packaging/windows/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: Test portable runtime contract
        run: pytest -q tests/test_windows_portable.py

      - name: Resolve version
        shell: pwsh
        run: |
          $version = (python -c "from app import __version__; print(__version__)").Trim()
          "MIANEM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Mianem.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/windows/Mianem.spec
          if (!(Test-Path "dist/Mianem.exe")) { throw "dist/Mianem.exe was not produced" }

      - name: Smoke test packaged executable data loading
        shell: pwsh
        run: |
          $env:MIANEM_STATE_DIR = Join-Path $env:RUNNER_TEMP "mianem-portable-smoke"
          $process = Start-Process -FilePath "dist/Mianem.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Portable smoke test failed with exit code $($process.ExitCode)" }

      - name: Smoke test packaged local server startup
        shell: pwsh
        run: |
          $env:MIANEM_STATE_DIR = Join-Path $env:RUNNER_TEMP "mianem-portable-server-smoke"
          $process = Start-Process -FilePath "dist/Mianem.exe" -ArgumentList "--server-smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:MIANEM_STATE_DIR "startup-error.txt"
            if (Test-Path $log) {
              Write-Host "--- Mianem startup diagnostic ---"
              Get-Content $log
              Write-Host "--- end diagnostic ---"
            }
            throw "Portable server smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create downloadable ZIP
        shell: pwsh
        run: |
          $release = "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item "dist/Mianem.exe" "$release/Mianem.exe"
          Copy-Item "packaging/windows/README-URUCHOM.txt" "$release/README-URUCHOM.txt"
          @(
            "Mianem $env:MIANEM_VERSION"
            "Windows 10/11 x64 portable single-executable build"
            "Source commit: $env:GITHUB_SHA"
            "Built by GitHub Actions on windows-latest"
          ) | Set-Content "$release/BUILD-INFO.txt" -Encoding utf8
          $zip = "Mianem-Windows-Portable-$env:MIANEM_VERSION.zip"
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256.txt" -Encoding ascii
          Get-Item $zip | Format-List Name,Length
          Get-Content "$zip.sha256.txt"

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mianem-Windows-Portable-${{ env.MIANEM_VERSION }}
          path: |
            Mianem-Windows-Portable-${{ env.MIANEM_VERSION }}.zip
            Mianem-Windows-Portable-${{ env.MIANEM_VERSION }}.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
