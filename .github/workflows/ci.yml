name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check frontend JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/workshop-v15.js
          node --check app/static/core-v15a.js
          node --check app/static/length-mode-v15.js
          node --check app/static/core-v15b1.js
          node --check app/static/core-v15b2.js
          node --check app/static/core-v15b3.js
